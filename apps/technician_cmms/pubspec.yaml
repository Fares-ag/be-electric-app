name: technician_cmms
description: Be Electric CMMS — technician & admin app.
publish_to: "none"

version: 1.0.0+7

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cmms_core:
    path: ../../packages/cmms_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "../../packages/cmms_core/assets/images/beelectric-insignia.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#002911"

flutter:
  uses-material-design: true
